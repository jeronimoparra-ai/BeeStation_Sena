<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BeeStation">
  <title>BeeStation</title>

  <!-- Fondo oscuro circular para visibilidad en tabs del browser -->
  <circle cx="16" cy="16" r="16" fill="#1C1C1E"/>

  <!-- Hexágono exterior — estructura del panal -->
  <polygon
    points="16,2.5 27.5,8.75 27.5,21.25 16,27.5 4.5,21.25 4.5,8.75"
    fill="none"
    stroke="#F59E0B"
    stroke-width="1.4"
    stroke-linejoin="round"
  />

  <!-- Hexágono interior — celda central -->
  <polygon
    points="16,7 23.5,11.25 23.5,19.75 16,24 8.5,19.75 8.5,11.25"
    fill="rgba(245,158,11,0.10)"
    stroke="#F59E0B"
    stroke-width="0.9"
    stroke-linejoin="round"
  />

  <!-- Cuerpo de la abeja — elipse central ámbar -->
  <ellipse cx="16" cy="16" rx="3.5" ry="4.5" fill="#F59E0B"/>

  <!-- Rayas del abdomen -->
  <rect x="13.2" y="14.5" width="5.6" height="0.9" rx="0.4" fill="#1C1C1E" opacity="0.55"/>
  <rect x="13.2" y="16.2" width="5.6" height="0.9" rx="0.4" fill="#1C1C1E" opacity="0.55"/>

  <!-- Alas — silueta mínima a cada lado -->
  <ellipse cx="11.5" cy="13.5" rx="2.2" ry="1.2" fill="rgba(245,158,11,0.30)" transform="rotate(-20 11.5 13.5)"/>
  <ellipse cx="20.5" cy="13.5" rx="2.2" ry="1.2" fill="rgba(245,158,11,0.30)" transform="rotate(20 20.5 13.5)"/>
</svg>
